author: Kimi
version: 1.7.0
display_name: 用户画像
short_desc: 发言统计 + 自动标签 + 风险分 + 图片输出 + 查询权限控制 + 历史扫描 + 社交来源 + 邀请守卫联动
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.16"
